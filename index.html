function breathe(v,pn){if(!AC||AC.state!=='running')return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='bandpass';f.frequency.setValueAtTime(1500,t);f.frequency.linearRampToValueAtTime(2300,t+.45);f.Q.value=1.2;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.025+.06*v,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.75);s.connect(f);f.connect(g);g.connect(pan(pn));s.start(t,Math.random()*1.4,.8)}
function sfxBones(pn,v){if(!AC||AC.state!=='running')return;const t=AC.currentTime,d=pan(pn);nz(t,.03,'bandpass',2600,.04+.05*v,d);nz(t+.07,.025,'bandpass',3400,.03+.04*v,d);nv('triangle',180,t,.05,.03*v,0,mg)}
function shriek(pn){ /* the screamer: loud, distorted, impossible to ignore */
  if(!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),ws=AC.createWaveShaper();
  const cv=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cv[i]=Math.tanh(x*4)}ws.curve=cv;
  o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(1500,t+.4);o.frequency.exponentialRampToValueAtTime(800,t+1.1);
  o2.frequency.setValueAtTime(260,t);o2.frequency.exponentialRampToValueAtTime(760,t+.4);o2.frequency.exponentialRampToValueAtTime(400,t+1.1);
  f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(1200,t);f.frequency.linearRampToValueAtTime(2200,t+.5);f.frequency.linearRampToValueAtTime(900,t+1.1);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  o.connect(ws);o2.connect(ws);ws.connect(f);f.connect(g);g.connect(pan(pn));o.start(t);o2.start(t);o.stop(t+1.25);o2.stop(t+1.25);
}
function scream(v,pn){ /* runners shriek as they close in */
  if(!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(920,t+.35);o.frequency.exponentialRampToValueAtTime(520,t+.85);
  o2.frequency.setValueAtTime(190,t);o2.frequency.exponentialRampToValueAtTime(460,t+.35);o2.frequency.exponentialRampToValueAtTime(260,t+.85);
  f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1600,t+.4);f.frequency.linearRampToValueAtTime(700,t+.85);

/* ================= INPUT (COD-style) ================= */
function addLook(dx,dy){ /* finer, acceleration-free aiming when scoped */
  const zf=cam.fov/70,ac=1+Math.min(.7,Math.hypot(dx,dy)*.035);const sn=SENS[si];pY-=dx*.0046*zf*ac*sn;pP-=dy*.0036*zf*ac*sn;scopeIdle=0} /* same look maths as Nagaloka */
function setupInput(){
  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='KeyC')toggleScope();if(e.code==='KeyQ')hold=true;if(e.code==='KeyZ')cycleZoom();if(e.code==='KeyF')toggleFlash();if(e.code==='KeyP')toggleFX();if(e.code==='KeyE'&&offNear)openUpg();if(e.code==='Space')jump();if(e.code==='KeyX'||e.code==='ControlLeft')toggleCrouch();if(e.code==='KeyM')mute()});
  addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyQ')hold=false});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mX=mY=0;firing=false;hold=false}); /* nothing gets stuck if the page loses focus */
  let md=false,lx=0,ly=0;
  ren.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){md=true;lx=e.clientX;ly=e.clientY}});
  addEventListener('pointerup',()=>md=false);
  addEventListener('pointermove',e=>{if(md&&e.pointerType==='mouse'){addLook(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY}});
  ren.domElement.addEventListener('click',shoot);
  const pad=$('movePad'),knob=$('knob'),zone=$('moveZone'),look=$('lookPad'),fb=$('fire');
  let mid=null,lid=null,fid=null,cx=0,cy=0,px=0,py=0,fx=0,fy=0;
  const find=(l,id)=>{for(const t of l)if(t.identifier===id)return t;return null};
  const stick=t=>{
    let dx=t.clientX-cx,dy=t.clientY-cy;const m=56,l=Math.hypot(dx,dy);
    if(l>m){const k=l-m;cx+=dx/l*k;cy+=dy/l*k;pad.style.left=(cx-62.5)+'px';pad.style.top=(cy-62.5)+'px';dx=dx/l*m;dy=dy/l*m} /* the stick base follows a wandering thumb */
    const q=Math.hypot(dx,dy)/m;
    if(q<.14){mX=0;mY=0}else{const w=Math.pow(Math.min(1,(q-.14)/.8),1.35);mX=dx/(q*m)*w;mY=dy/(q*m)*w} /* generous dead zone + fine control at low tilt */
    knob.style.transform=`translate(${dx}px,${dy}px)`;
  };
  const endM=()=>{mid=null;mX=mY=0;knob.style.transform='';pad.style.left=pad.style.top=pad.style.bottom='';pad.classList.remove('on')};
  const o={passive:false};
  zone.addEventListener('touchstart',e=>{e.preventDefault();if(mid!==null)return;const t=e.changedTouches[0];mid=t.identifier;pad.style.left=(t.clientX-62.5)+'px';pad.style.top=(t.clientY-62.5)+'px';pad.style.bottom='auto';pad.classList.add('on');cx=t.clientX;cy=t.clientY;stick(t)},o); /* the stick is centred exactly where the thumb lands */
  zone.addEventListener('touchmove',e=>{e.preventDefault();const t=find(e.touches,mid);if(t)stick(t)},o);
  zone.addEventListener('touchend',e=>{if(find(e.changedTouches,mid))endM()});zone.addEventListener('touchcancel',endM);
  look.addEventListener('touchstart',e=>{e.preventDefault();if(lid===null){const t=e.changedTouches[0];lid=t.identifier;px=t.clientX;py=t.clientY}},o);
  look.addEventListener('touchmove',e=>{e.preventDefault();const t=find(e.touches,lid);if(!t)return;addLook(t.clientX-px,t.clientY-py);px=t.clientX;py=t.clientY},o);
  look.addEventListener('touchend',e=>{if(find(e.changedTouches,lid))lid=null});look.addEventListener('touchcancel',()=>lid=null);
  fb.addEventListener('touchstart',e=>{e.preventDefault();if(fid===null){const t=e.changedTouches[0];fid=t.identifier;fx=t.clientX;fy=t.clientY;firing=true;shoot()}},o); /* fires on press, hold to keep firing, drag the same thumb to aim */
  fb.addEventListener('touchmove',e=>{e.preventDefault();const t=find(e.touches,fid);if(!t)return;addLook(t.clientX-fx,t.clientY-fy);fx=t.clientX;fy=t.clientY},o);
  fb.addEventListener('touchend',e=>{if(find(e.changedTouches,fid)){fid=null;firing=false;if(armed&&scoped)shoot();armed=false}});fb.addEventListener('touchcancel',()=>{fid=null;firing=false;armed=false});
  $('aim').addEventListener('touchstart',e=>{e.preventDefault();toggleScope()},o);
  $('rld').addEventListener('touchstart',e=>{e.preventDefault();reload()},o);
  $('hold').addEventListener('touchstart',e=>{e.preventDefault();hold=true},o);
  $('hold').addEventListener('touchend',()=>hold=false);
  $('zoom').addEventListener('touchstart',e=>{e.preventDefault();cycleZoom()},o);
  $('jump').addEventListener('touchstart',e=>{e.preventDefault();jump()},o);
  $('flt').addEventListener('touchstart',e=>{e.preventDefault();toggleFlash()},o);
  $('crch').addEventListener('touchstart',e=>{e.preventDefault();toggleCrouch()},o);
  $('sens').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();si=(si+1)%SENS.length;$('sens').textContent='SENS '+SENS[si].toFixed(1)});
  addEventListener('wheel',e=>{if(scoped)cycleZoom()},{passive:true});
  $('prompt').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();openUpg()});$('upclose').addEventListener('click',closeUpg);
  $('fxb').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();toggleFX()});
  $('mute').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();mute()});
}
function mute(){musicOn=!musicOn;if(mg)mg.gain.setTargetAtTime(musicOn?.8:0,AC.currentTime,.1);$('mute').textContent=musicOn?'♪':'✕'}
/* ================= MAIN ================= */
let fT=0,fN=0;
function loop(){
  requestAnimationFrame(loop);if(!running)return;
  if(paused){clock.getDelta();fxRender(performance.now());return} /* shopping pauses the game */
  const raw=clock.getDelta(),dt=Math.min(.033,raw),t=performance.now();
  cd=Math.max(0,cd-dt);rec*=.84;
  updReload(dt);WX=Math.sin(t*.00011)*2.4;WZ=Math.cos(t*.00017)*1.8;
  if(firing)shoot();
  if(!dead){updPlayer(dt,t);updEnemies(dt)}
  updBullets(dt);updParts(dt);updSplash(dt);
  wheel.rotation.z+=dt*.06;carousel.rotation.y+=dt*.25;updRides(dt,t);updExtras(dt,t);updPickups(dt);updFlash(dt);updAmbience(dt);updApoc(dt,t);updBlasts(dt);updOffice();
  fearT-=dt;if(fearT<=0){fearT=.1;$('fear').style.opacity=(fearV*.9*(.75+.25*Math.sin(t*.012))).toFixed(2)}
  skyU.uT.value=t*.001;sky.position.copy(cam.position);
  LT[0].intensity=Math.random()<.015?.5:1.1+Math.random()*.25;
  LT[1].intensity=.8+.3*Math.sin(t*.0014);
  if(expT>0){LT[1].position.set(expX,3,expZ);LT[1].color.setHex(0xff9a40);LT[1].intensity=7*expT;expT-=dt*2.2;if(expT<=0){LT[1].color.setHex(0xff2848);LT[1].position.set(-30,4,-12)}}
  LT[2].intensity=Math.random()<.01?.3:.75+Math.random()*.15;
  HM.intensity=Math.random()<.004?.6:.95;updSky(dt,t);
  if(Math.random()<.03)bulbMat.color.setScalar(.7+Math.random()*.3);
  animRifle(dt,t);updCasings(dt);if(scoped)updScopeData(dt);
  fN++;fT+=raw;
  if(fT>2.5){
    const f=fN/fT;fN=fT=0;
    if(f<40){if(QL>0)setQuality(QL-1);else if(ratio>.6){ratio-=.1;ren.setPixelRatio(ratio);fxResize()}okRuns=0} /* drop a quality tier first, then resolution */
    else if(f>57&&QL<2){if(++okRuns>=3){setQuality(QL+1);okRuns=0}}else okRuns=0;
    const inf=ren.info.render;$('fps').textContent=`${f.toFixed(0)} FPS · Q${QL}${FX&&FX.on?' · FX':''} · ${inf.calls} calls · ${(inf.triangles/1000).toFixed(0)}k tris`;
  }
  fxRender(t);
}
const TIPS=['ヒント：頭を狙え　TIP: HEADSHOTS DROP THEM IN ONE','息を止めて照準を安定　HOLD BREATH TO STEADY THE SCOPE','ZOOMで距離を調整　CYCLE ZOOM FOR LONG RANGE','弾は5発、装填は慎重に　5 ROUNDS PER MAGAZINE','ゲートを守れ　HOLD THE GATE'];
let starting=false;
function start(e){
  if(e)e.preventDefault();if(running||starting)return;starting=true;
  initAudio(); /* must happen inside the tap for iOS */
  $('intro').classList.add('hide');const LD=$('load');LD.style.display='block';
  let ti=0;const tip=$('tip');tip.textContent=TIPS[0];const tv=setInterval(()=>{ti=(ti+1)%TIPS.length;tip.textContent=TIPS[ti]},1500);
  const bar=(p)=>{$('barf').style.width=p+'%';$('lp').textContent=Math.round(p)+'%'};
  const mobile=innerWidth<800||/iPhone|iPad|Android/i.test(navigator.userAgent);
  const steps=[
    ()=>{ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',stencil:false});
      ratio=mobile?Math.min(devicePixelRatio,.9):Math.min(devicePixelRatio,1.25);ren.setPixelRatio(ratio);ren.setSize(innerWidth,innerHeight,false);
      ren.outputEncoding=THREE.sRGBEncoding;document.body.prepend(ren.domElement);
      cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,230);cam.position.set(P.x,1.7,P.z);fxInit()},
    build,mkZombies,
    ()=>{makeRifle();mkParts();mkSplats();mkCasings();mkPickups();mkFlash();setupInput();
      addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight,false);fxResize()})}
  ];
  let i=0;bar(4);
  (function next(){
    if(i<steps.length){setTimeout(()=>{steps[i]();i++;bar(i/steps.length*100);next()},420)}
    else setTimeout(()=>{clearInterval(tv);LD.classList.add('hide');setTimeout(()=>LD.remove(),1000);running=true;clock.start();startWave();upd();requestAnimationFrame(loop)},900);
  })();
}
$('enter').addEventListener('click',start);$('enter').addEventListener('touchstart',start,{passive:false});
