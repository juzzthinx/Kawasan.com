<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KAWASAN — J.Nazreen</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
#canvas { display:block; width:100vw; height:100vh; }

#no-webgl {
  display:none; position:fixed; inset:0; background:#000;
  color:#888; font-size:1rem; align-items:center; justify-content:center;
  flex-direction:column; gap:1rem; text-align:center; padding:2rem;
}

/* LOADING */
#loading {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:1.2rem; z-index:200;
  transition:opacity 1.2s ease;
}
#loading-label {
  color:#444; font-size:0.55rem; letter-spacing:0.6em; text-transform:uppercase;
}
#loading h1 {
  color:#d4c9a8; font-size:clamp(2.5rem,10vw,6rem);
  letter-spacing:0.5em; font-weight:100; font-family:'Courier New',monospace;
  text-shadow:0 0 40px rgba(212,201,168,0.15);
}
#loading-sub-title {
  color:#555; font-size:0.6rem; letter-spacing:0.4em;
}
#loading-bar-wrap { width:180px; height:1px; background:#1a1a1a; }
#loading-bar { height:1px; background:#d4c9a8; width:0%; transition:width 0.4s ease; }
#loading-msg { color:#333; font-size:0.58rem; letter-spacing:0.2em; min-height:1em; }

/* NENEK SILHOUETTE INTRO */
#nenek-intro {
  position:fixed; inset:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; z-index:195; opacity:0;
  transition:opacity 0.8s ease;
  pointer-events:none;
}
#nenek-intro.show { opacity:1; pointer-events:all; }
#nenek-intro canvas { width:100vw; height:100vh; position:absolute; inset:0; }
#intro-text {
  position:absolute; bottom:18%;
  color:rgba(200,50,50,0); font-size:clamp(0.7rem,2vw,1rem);
  letter-spacing:0.55em; text-align:center; font-family:'Courier New',monospace;
  transition:color 1.5s ease;
  text-shadow: 0 0 30px rgba(255,0,0,0.6);
}
#intro-text.show { color:rgba(200,50,50,0.85); }
#intro-skip {
  position:absolute; bottom:8%;
  color:rgba(255,255,255,0.15); font-size:0.48rem; letter-spacing:0.4em;
  cursor:pointer;
}

/* HUD */
#hud {
  position:fixed; top:0; left:0; right:0; bottom:0;
  pointer-events:none; z-index:10;
}
#brand {
  position:absolute; top:1.2rem; left:50%;
  transform:translateX(-50%);
  color:rgba(212,201,168,0.4); font-size:0.6rem; letter-spacing:0.6em;
}
#byline {
  position:absolute; top:2.2rem; left:50%;
  transform:translateX(-50%);
  color:rgba(212,201,168,0.18); font-size:0.45rem; letter-spacing:0.4em;
}
#time-display {
  position:absolute; bottom:1.4rem; left:1.4rem;
  color:rgba(212,201,168,0.3); font-size:0.58rem; letter-spacing:0.2em;
}
#coords {
  position:absolute; bottom:1.4rem; right:1.4rem;
  color:rgba(212,201,168,0.2); font-size:0.5rem; letter-spacing:0.1em; text-align:right;
}
#torch-indicator {
  position:absolute; top:1.2rem; right:1.4rem;
  color:rgba(255,220,100,0.5); font-size:0.5rem; letter-spacing:0.2em;
  opacity:0; transition:opacity 0.5s;
}
#torch-indicator.on { opacity:1; }
#torch-indicator.low { color:rgba(255,100,50,0.8); animation: torch-pulse 0.6s infinite alternate; }
#torch-indicator.dead { color:rgba(100,50,50,0.6); }
@keyframes torch-pulse { from{opacity:0.5} to{opacity:1} }

/* CROSSHAIR */
#crosshair {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:12px; height:12px; pointer-events:none;
}
#crosshair::before, #crosshair::after {
  content:''; position:absolute; background:rgba(212,201,168,0.25);
}
#crosshair::before { width:1px; height:12px; left:50%; top:0; }
#crosshair::after  { width:12px; height:1px; top:50%; left:0; }

/* DPAD */
#dpad {
  position:fixed; bottom:2.5rem; left:18%;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(3,52px);
  grid-template-rows:repeat(3,52px);
  gap:5px; z-index:20; pointer-events:all;
}
#dpad button {
  background:rgba(212,201,168,0.07);
  border:1px solid rgba(212,201,168,0.12);
  color:rgba(212,201,168,0.55); font-size:1.1rem;
  border-radius:6px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  user-select:none; touch-action:manipulation;
  transition:background 0.08s, border-color 0.08s;
}
#dpad button:active, #dpad button.pressed {
  background:rgba(212,201,168,0.18);
  border-color:rgba(212,201,168,0.35);
}
#dpad .empty { visibility:hidden; }
#dpad #btn-sprint {
  font-size:0.48rem; letter-spacing:0.08em;
  color:rgba(212,201,168,0.35);
  background:rgba(212,201,168,0.04);
}

/* HORROR OVERLAY */
#horror-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0);
  pointer-events:none; z-index:50;
  transition:background 0.25s ease;
}
#horror-overlay.flash   { background:rgba(255,255,255,0.04); }
#horror-overlay.red     { background:rgba(100,0,0,0.2); }
#horror-overlay.white   { background:rgba(255,255,255,0.12); }

/* SUBTITLE */
#subtitle {
  position:fixed; bottom:22%; left:50%;
  transform:translateX(-50%);
  color:rgba(0,0,0,0); font-size:0.72rem;
  letter-spacing:0.35em; pointer-events:none; z-index:55;
  transition:color 0.6s ease; text-align:center; white-space:nowrap;
  text-shadow:0 0 20px rgba(200,170,120,0.5);
}
#subtitle.visible { color:rgba(200,175,130,0.9); }

/* STATIC FRAME */
#static-frame {
  position:fixed; inset:0; display:none;
  align-items:center; justify-content:center;
  z-index:60; background:#000;
}
#static-frame.active { display:flex; }
#static-canvas { width:100vw; height:100vh; image-rendering:pixelated; }
#static-msg {
  position:absolute; bottom:14%;
  color:rgba(200,185,155,0.75); font-size:0.65rem;
  letter-spacing:0.45em; font-family:'Courier New',monospace;
  text-transform:uppercase;
}

/* VIGNETTE */
#vignette {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
  pointer-events:none; z-index:5;
}

/* CONTROLS HINT */
#hint {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:rgba(212,201,168,0.45); font-size:0.62rem;
  letter-spacing:0.25em; text-align:center;
  z-index:15; pointer-events:none;
  transition:opacity 2s ease;
}
#hint p { margin-bottom:0.5rem; }

/* NENEK WARNING */
#nenek-warn {
  position:fixed; top:35%; left:50%;
  transform:translateX(-50%);
  color:rgba(0,0,0,0); font-size:0.55rem;
  letter-spacing:0.5em; pointer-events:none; z-index:56;
  transition:color 1s ease; text-align:center;
}
#nenek-warn.visible { color:rgba(180,100,100,0.6); }

/* NENEK PROXIMITY PULSE */
#nenek-pulse {
  position:fixed; inset:0; pointer-events:none; z-index:49;
  background:radial-gradient(ellipse at center, rgba(120,0,0,0) 40%, rgba(120,0,0,0) 100%);
  transition:background 0.4s ease;
}
#nenek-pulse.near {
  animation: pulse-red 1.2s infinite;
}
@keyframes pulse-red {
  0%   { background:radial-gradient(ellipse at center, rgba(120,0,0,0) 40%, rgba(100,0,0,0.12) 100%); }
  50%  { background:radial-gradient(ellipse at center, rgba(120,0,0,0) 30%, rgba(140,0,0,0.28) 100%); }
  100% { background:radial-gradient(ellipse at center, rgba(120,0,0,0) 40%, rgba(100,0,0,0.12) 100%); }
}
</style>
</head>
<body>

<div id="no-webgl">
  <div style="letter-spacing:0.4em">KAWASAN</div>
  <div style="color:#444;font-size:0.8rem;margin-top:0.5rem">WEBGL TIDAK DISOKONG<br>CUBA PELAYAR LAIN</div>
</div>

<div id="loading">
  <div id="loading-label">F12 PRESENTS</div>
  <h1>KAWASAN</h1>
  <div id="loading-sub-title">by J.Nazreen</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-msg">memuatkan dunia...</div>
</div>

<!-- NENEK SILHOUETTE INTRO -->
<div id="nenek-intro">
  <canvas id="intro-canvas"></canvas>
  <div id="intro-text">DIA SENTIASA DI SINI</div>
  <div id="intro-skip">SENTUH UNTUK TERUSKAN</div>
</div>

<div id="hud">
  <div id="brand">KAWASAN — J.NAZREEN</div>
  <div id="byline">F12 PRODUCTIONS</div>
  <div id="time-display">03:17 AM</div>
  <div id="coords">3.1390° N, 101.6869° E</div>
  <div id="torch-indicator">⚡ TORCH</div>
  <div id="crosshair"></div>
</div>

<div id="vignette"></div>
<div id="horror-overlay"></div>
<div id="nenek-pulse"></div>
<div id="subtitle"></div>
<div id="nenek-warn">DIA DENGAR AWAK</div>

<div id="static-frame">
  <canvas id="static-canvas" width="640" height="360"></canvas>
  <div id="static-msg"></div>
</div>

<div id="dpad">
  <div class="empty"></div>
  <button id="btn-up"     data-dir="forward">▲</button>
  <button id="btn-sprint" data-dir="sprint">RUN</button>
  <button id="btn-left"   data-dir="left">◀</button>
  <button id="btn-down"   data-dir="back">▼</button>
  <button id="btn-right"  data-dir="right">▶</button>
  <div class="empty"></div>
  <div class="empty"></div>
  <div class="empty"></div>
</div>

<div id="hint">
  <p>WASD / ANAK PANAH</p>
  <p style="color:rgba(212,201,168,0.25)">SHIFT — lari &nbsp;|&nbsp; KLIK — pusing pandangan</p>
</div>

<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ─── WEBGL CHECK ──────────────────────────────────────────────
const canvas = document.getElementById('canvas');
try {
  const t = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!t) throw 0;
} catch(e) {
  document.getElementById('no-webgl').style.display = 'flex';
  document.getElementById('loading').style.display = 'none';
  return;
}

// ─── NENEK INTRO ANIMATION ───────────────────────────────────
function runNenekIntro(onDone){
  const introEl   = document.getElementById('nenek-intro');
  const introC    = document.getElementById('intro-canvas');
  const introText = document.getElementById('intro-text');
  const introSkip = document.getElementById('intro-skip');
  introC.width  = window.innerWidth;
  introC.height = window.innerHeight;
  const ic = introC.getContext('2d');
  let phase = 0; // 0=fade in, 1=walk, 2=fade out
  let walkX = window.innerWidth * 0.15; // starts from far left
  let walkT = 0;
  let fadeAlpha = 0;
  let done = false;
  let textShown = false;

  function finish(){
    if(done) return; done=true;
    introEl.style.opacity='0';
    setTimeout(()=>{ introEl.style.display='none'; onDone(); }, 900);
  }

  introEl.classList.add('show');
  introSkip.addEventListener('click', finish);
  introSkip.addEventListener('touchstart', finish);

  function drawFrame(ts){
    if(done) return;
    requestAnimationFrame(drawFrame);
    const W = introC.width, H = introC.height;
    ic.clearRect(0,0,W,H);

    // Background — deep black with red vignette
    ic.fillStyle = '#000'; ic.fillRect(0,0,W,H);

    // Distant red city bleed
    const cityGrad = ic.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.35, W*0.65);
    cityGrad.addColorStop(0,'rgba(80,0,0,0.18)');
    cityGrad.addColorStop(1,'transparent');
    ic.fillStyle=cityGrad; ic.fillRect(0,0,W,H);

    walkT += 0.016;
    if(phase===0){ fadeAlpha=Math.min(1,fadeAlpha+0.012); if(fadeAlpha>=1) phase=1; }
    if(phase===1){
      walkX += 0.55;
      if(walkX > W*0.88){ phase=2; }
      if(!textShown && walkX > W*0.35){ textShown=true; introText.classList.add('show'); }
    }
    if(phase===2){
      fadeAlpha=Math.max(0,fadeAlpha-0.018);
      if(fadeAlpha<=0) finish();
    }

    ic.globalAlpha = fadeAlpha;

    // PPR building silhouettes — background
    const blds=[
      {x:0,    w:W*0.18,h:H*0.55},{x:W*0.16,w:W*0.12,h:H*0.62},
      {x:W*0.7,w:W*0.16,h:H*0.58},{x:W*0.84,w:W*0.18,h:H*0.5},
      {x:W*0.3,w:W*0.08,h:H*0.45},{x:W*0.6,w:W*0.09,h:H*0.48},
    ];
    blds.forEach(b=>{
      ic.fillStyle='rgba(8,0,0,0.95)';
      ic.fillRect(b.x,H-b.h,b.w,b.h);
      // Window grid — occasional dim red
      for(let wy=H-b.h+8;wy<H-12;wy+=14){
        for(let wx=b.x+6;wx<b.x+b.w-6;wx+=10){
          if(Math.random()>0.85) ic.fillStyle='rgba(120,20,0,0.25)';
          else ic.fillStyle='rgba(20,5,5,0.6)';
          ic.fillRect(wx,wy,5,7);
        }
      }
    });

    // Ground
    ic.fillStyle='rgba(12,0,0,0.9)';
    ic.fillRect(0,H*0.72,W,H*0.28);
    // Longkang edge
    ic.strokeStyle='rgba(40,10,10,0.6)'; ic.lineWidth=2;
    ic.beginPath(); ic.moveTo(0,H*0.72); ic.lineTo(W,H*0.72); ic.stroke();

    // Ground puddle reflection
    const pudW = W*0.3;
    const pudX = walkX - pudW*0.5;
    const pudGrad = ic.createRadialGradient(walkX,H*0.74,0,walkX,H*0.74,pudW*0.5);
    pudGrad.addColorStop(0,'rgba(80,0,0,0.15)');
    pudGrad.addColorStop(1,'transparent');
    ic.fillStyle=pudGrad; ic.fillRect(pudX,H*0.72,pudW,H*0.12);

    // ── NENEK SILHOUETTE ──
    const GH = H * 0.32; // figure height
    const GY = H * 0.72 - GH * 0.88; // feet at ground
    const step = Math.sin(walkT * 2.4) * 0.025 * GH;

    ic.save();
    ic.translate(walkX, GY + step);

    // Red glow aura behind her
    const aura = ic.createRadialGradient(0, GH*0.45, 0, 0, GH*0.45, GH*0.75);
    aura.addColorStop(0,'rgba(180,0,0,0.22)');
    aura.addColorStop(0.5,'rgba(120,0,0,0.10)');
    aura.addColorStop(1,'transparent');
    ic.fillStyle=aura; ic.fillRect(-GH*0.8,-GH*0.1,GH*1.6,GH*1.2);

    // Body — hunched old woman
    ic.fillStyle='rgba(0,0,0,1)';

    // Legs — walking animation
    const legSwing = Math.sin(walkT*2.4)*0.12*GH;
    // Left leg
    ic.save();
    ic.translate(-GH*0.07, GH*0.72);
    ic.rotate(legSwing*0.06);
    ic.fillRect(-GH*0.055, 0, GH*0.11, GH*0.28);
    // Foot
    ic.fillRect(-GH*0.055, GH*0.26, GH*0.14, GH*0.055);
    ic.restore();
    // Right leg
    ic.save();
    ic.translate(GH*0.07, GH*0.72);
    ic.rotate(-legSwing*0.06);
    ic.fillRect(-GH*0.055, 0, GH*0.11, GH*0.28);
    ic.fillRect(-GH*0.14, GH*0.26, GH*0.14, GH*0.055);
    ic.restore();

    // Baju kurung / kebaya body — flowing
    ic.beginPath();
    ic.moveTo(-GH*0.22, GH*0.32);
    ic.lineTo(-GH*0.19, GH*0.48);
    ic.lineTo(-GH*0.16, GH*0.73);
    ic.lineTo( GH*0.16, GH*0.73);
    ic.lineTo( GH*0.19, GH*0.48);
    ic.lineTo( GH*0.22, GH*0.32);
    ic.lineTo( GH*0.14, GH*0.28);
    ic.lineTo(-GH*0.14, GH*0.28);
    ic.closePath();
    ic.fill();

    // Hunched back / upper torso
    ic.beginPath();
    ic.ellipse(-GH*0.03, GH*0.24, GH*0.145, GH*0.11, -0.22, 0, Math.PI*2);
    ic.fill();

    // Head — tilted down (looking at ground)
    ic.beginPath();
    ic.ellipse(-GH*0.07, GH*0.12, GH*0.095, GH*0.105, 0.18, 0, Math.PI*2);
    ic.fill();

    // White hair — stringy, long
    ic.strokeStyle='rgba(220,215,195,0.55)';
    ic.lineWidth=1;
    for(let h=0;h<14;h++){
      const hx = -GH*0.13 + (Math.random()-0.5)*GH*0.18;
      const hy = GH*0.08;
      ic.beginPath();
      ic.moveTo(hx, hy);
      ic.quadraticCurveTo(hx+(Math.random()-0.5)*GH*0.1, hy+GH*0.12, hx+(Math.random()-0.5)*GH*0.08, hy+GH*0.22);
      ic.stroke();
    }

    // Reaching arm
    const armSwing = Math.sin(walkT*2.4+1.2)*0.08*GH;
    ic.fillStyle='rgba(0,0,0,1)';
    ic.save();
    ic.translate(GH*0.14, GH*0.3);
    ic.rotate(0.35 + armSwing*0.04);
    ic.fillRect(-GH*0.04, 0, GH*0.07, GH*0.35);
    // Long fingers
    for(let f=0;f<4;f++){
      ic.fillRect(-GH*0.045+f*GH*0.025, GH*0.33, GH*0.018, GH*0.10);
    }
    ic.restore();
    // Other arm — walking swing
    ic.save();
    ic.translate(-GH*0.16, GH*0.30);
    ic.rotate(-0.2 - armSwing*0.04);
    ic.fillRect(-GH*0.03, 0, GH*0.065, GH*0.28);
    ic.restore();

    // Eyes — amber glow (visible in silhouette because supernatural)
    const eyeGlow1 = ic.createRadialGradient(-GH*0.09, GH*0.115, 0, -GH*0.09, GH*0.115, GH*0.045);
    eyeGlow1.addColorStop(0,'rgba(255,160,30,0.95)');
    eyeGlow1.addColorStop(0.4,'rgba(200,80,0,0.5)');
    eyeGlow1.addColorStop(1,'transparent');
    ic.fillStyle=eyeGlow1; ic.fillRect(-GH*0.14,GH*0.07,GH*0.1,GH*0.09);

    const eyeGlow2 = ic.createRadialGradient(-GH*0.04, GH*0.115, 0, -GH*0.04, GH*0.115, GH*0.04);
    eyeGlow2.addColorStop(0,'rgba(255,160,30,0.9)');
    eyeGlow2.addColorStop(0.4,'rgba(200,80,0,0.4)');
    eyeGlow2.addColorStop(1,'transparent');
    ic.fillStyle=eyeGlow2; ic.fillRect(-GH*0.09,GH*0.07,GH*0.1,GH*0.09);

    // Red/white flicker highlight — occasional
    if(Math.sin(walkT*7.3)>0.85){
      ic.fillStyle='rgba(255,50,50,0.08)';
      ic.fillRect(-GH*0.25,-GH*0.05,GH*0.5,GH*1.1);
    }

    ic.restore();

    // Red scanlines
    ic.fillStyle='rgba(60,0,0,0.09)';
    for(let sl=0;sl<H;sl+=4) ic.fillRect(0,sl,W,2);

    // White outline flicker on her — horror effect
    if(Math.sin(walkT*11)>0.92){
      ic.save();
      ic.translate(walkX, GY + step);
      ic.strokeStyle='rgba(255,255,255,0.18)';
      ic.lineWidth=1.5;
      ic.beginPath();
      ic.ellipse(-GH*0.07, GH*0.12, GH*0.098, GH*0.108, 0.18, 0, Math.PI*2);
      ic.stroke();
      ic.restore();
    }

    // Vignette
    const vig = ic.createRadialGradient(W*0.5,H*0.5,W*0.08,W*0.5,H*0.5,W*0.78);
    vig.addColorStop(0,'transparent');
    vig.addColorStop(1,'rgba(0,0,0,0.95)');
    ic.fillStyle=vig; ic.fillRect(0,0,W,H);

    ic.globalAlpha=1;
  }
  requestAnimationFrame(drawFrame);
}

// ─── RENDERER ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d14);
scene.fog = new THREE.FogExp2(0x0d0d14, 0.012);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(0, 1.7, 0);

const clock = new THREE.Clock();

// ─── LOADING UI ───────────────────────────────────────────────
const loadBar = document.getElementById('loading-bar');
const loadMsg  = document.getElementById('loading-msg');
function setLoad(pct, msg){ loadBar.style.width=pct+'%'; if(msg) loadMsg.textContent=msg; }

// ─── MATERIALS ────────────────────────────────────────────────
const M = {
  road:      new THREE.MeshLambertMaterial({ color:0x1a1a1e }),
  sidewalk:  new THREE.MeshLambertMaterial({ color:0x222228 }),

// ─── HELPERS ──────────────────────────────────────────────────
function box(w,h,d,mat,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  if(ry) m.rotation.y = ry;
  m.receiveShadow = true; m.castShadow = true;
  world.add(m); return m;
}
function cyl(r,h,mat,x,y,z,segs){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segs||8), mat);
  m.position.set(x,y,z); m.castShadow=true; world.add(m); return m;
}
function plane(w,d,mat,x,y,z,rx){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat);
  m.position.set(x,y,z);
  m.rotation.x = rx!==undefined ? rx : -Math.PI/2;
  m.receiveShadow=true;
  world.add(m); return m;
}

function backAlleyUpgraded(side, startZ, length){
  const ox = side*(STREET_W*0.5 + 2.2 + 14);
  const halfL = length*0.5;

  // Floor — dark cracked concrete with subtle wet sheen
  plane(3.5, length, M.alley_wet, ox, 0.005, startZ);

  // Concrete floor underneath (receive shadows)
  box(3.5, 0.1, length, M.alley_b, ox, -0.05, startZ);

  // Left wall (shophouse back)
  box(0.5, 10, length+2, M.alley_wall_a, ox - side*1.75, 5, startZ);
  // Right wall (opposite building)
  box(0.5, 8, length+2, M.alley_wall_b, ox + side*1.75, 4, startZ);

  // Wall texture details — horizontal crack strips
  const numStrips = Math.floor(length/12);
  for(let n=0;n<numStrips;n++){
    const sz = startZ - halfL + n*(length/numStrips);
    // Stain patch on wall
    box(0.08, 0.6+Math.random()*1.2, 2+Math.random()*4, M.alley_stain,
      ox - side*1.5, 0.8+Math.random()*2.5, sz);
    // Moss patch lower wall
    if(Math.random()>0.5){
      box(0.06, 0.4+Math.random()*0.8, 1+Math.random()*2.5, M.alley_moss,
        ox - side*1.68, 0.2+Math.random()*0.6, sz+Math.random()*3);
    }
  }

  // Pipes along back wall — vertical and horizontal runs
  const numPipes = 4 + Math.floor(length/18);
  for(let p=0;p<numPipes;p++){
    const pz = startZ - halfL + p*(length/numPipes) + Math.random()*6;
    const ph = 3 + Math.random()*4;
    cyl(0.04, ph, M.pipe, ox - side*1.55, ph*0.5, pz, 6);
    // Horizontal connector
    if(Math.random()>0.5){
      box(0.06, 0.06, 0.8+Math.random()*1.5, M.pipe,
        ox - side*1.45, 1.2+Math.random()*2, pz);
    }
    // Pipe drip stain below
    box(0.07, 0.5+Math.random()*1, 0.07, M.alley_stain,
      ox - side*1.55, 0.25, pz);
  }

  // Bins, crates, debris clusters
  const numItems = Math.floor(length/8);
  for(let n=0;n<numItems;n++){
    const iz = startZ - halfL + n*(length/numItems) + Math.random()*5;
    const side2 = Math.random()>0.5 ? -1 : 1;
    const bx = ox + side2*(0.5+Math.random()*0.7);

    // Trash bin (cylinder)
    const binH = 0.7+Math.random()*0.3;
    cyl(0.18, binH, M.rust_dark, bx, binH*0.5, iz, 8);
    // Bin lid
    box(0.44,0.06,0.44, M.rust, bx, binH+0.03, iz);

    // Crate stack
    if(Math.random()>0.55){
      const cH = 0.35+Math.random()*0.25;
      box(0.6,cH,0.6, M.crate, bx+(Math.random()-0.5)*0.6, cH*0.5, iz+Math.random()*1.5);
      if(Math.random()>0.5)
        box(0.5,cH,0.5, M.crate, bx+(Math.random()-0.5)*0.5, cH*1.5, iz+Math.random()*1.5);
    }

    // Soggy cardboard on ground
    if(Math.random()>0.6){
      box(0.8+Math.random()*0.5, 0.04, 0.5+Math.random()*0.5, M.alley_stain,
        ox+(Math.random()-0.5)*2, 0.02, iz+Math.random()*2);
    }
  }

  // Puddles — more of them, varied sizes, full wet sheen
  const numPuddles = 5 + Math.floor(length/14);
  for(let p=0;p<numPuddles;p++){
    const pz = startZ - halfL + Math.random()*length;
    const pw = 0.5+Math.random()*1.4;
    const pd = 0.3+Math.random()*0.9;
    const pudMat = new THREE.MeshStandardMaterial({
      color:0x05050c, roughness:0.02, metalness:0.95, transparent:true, opacity:0.9
    });
    const pud = new THREE.Mesh(new THREE.PlaneGeometry(pw,pd), pudMat);
    pud.rotation.x = -Math.PI/2;
    pud.position.set(ox+(Math.random()-0.5)*2, 0.012, pz);
    world.add(pud);
  }

  // Overhead pipes / beams crossing alley
  const numBeams = Math.floor(length/20);
  for(let b=0;b<numBeams;b++){
    const bz = startZ - halfL + b*(length/numBeams) + 8;
    box(4, 0.08, 0.08, M.pipe, ox, 4.5+Math.random()*1.5, bz);
    // Hanging wire from beam
    box(0.02, 1.2+Math.random()*0.8, 0.02, M.pipe, ox+(Math.random()-0.5)*1.2, 3.8, bz);
  }

  // Alley dim red-tinted lights — sparse, moody
  const numAlleyLights = Math.floor(length/35);
  for(let l=0;l<numAlleyLights;l++){
    const lz = startZ - halfL + (l+0.5)*(length/numAlleyLights);
    const al = new THREE.PointLight(0x552200, 0.35, 8, 2);
    al.position.set(ox, 3.8, lz);
    scene.add(al);
    lampLights.push({light:al, base:0.35, phase:Math.random()*Math.PI*2, neon:true});
    // Small lamp housing
    box(0.2,0.12,0.2, M.rust_dark, ox, 4.0, lz);
  }

  // Graffiti-style dark patches on wall (flat boxes)
  for(let g=0;g<Math.floor(length/16);g++){
    const gz = startZ - halfL + Math.random()*length;
    box(0.04, 0.4+Math.random()*0.9, 0.8+Math.random()*1.8, M.alley_stain,
      ox - side*1.72, 0.7+Math.random()*2, gz);
  }
}

// ─── PLAYER MOVEMENT ──────────────────────────────────────────
const playerPos=new THREE.Vector3(0,1.7,0);
const WALK=4.2, RUN=9.0;

function updatePlayer(dt){
  const speed = keys.sprint ? RUN : WALK;
  const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt = new THREE.Vector3( Math.cos(yaw),0,-Math.sin(yaw));
  const move= new THREE.Vector3();

  if(keys.forward) move.add(fwd);
  if(keys.back)    move.sub(fwd);
  if(keys.right)   move.add(rgt);
  if(keys.left)    move.sub(rgt);

  if(move.length()>0){
    move.normalize().multiplyScalar(speed*dt);
    const np = playerPos.clone().add(move);
    np.x = Math.max(-22, Math.min(22, np.x));
    np.z = Math.max(-145, Math.min(65, np.z));
    if(Math.abs(np.x)>16.2) np.x = Math.sign(np.x)*16.2;
    playerPos.copy(np);
  }
  playerPos.y=1.7;

  camera.position.copy(playerPos);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  const behind=new THREE.Vector3(Math.sin(yaw)*1.2,0,Math.cos(yaw)*1.2);
  const avPos=playerPos.clone().add(behind);
  avPos.y=0;
  avatarGroup.position.copy(avPos);
  avatarGroup.rotation.y=yaw+Math.PI;
  avatarGroup.visible = pitch < 0.3;

  // Torch — bright spot ahead, fill point behind
  const tFwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  torchLight.position.copy(playerPos).addScaledVector(tFwd,0.4);
  torchLight.position.y=playerPos.y-0.1;
  torchLight.target.position.copy(playerPos).addScaledVector(tFwd,12);
  torchLight.target.position.y=playerPos.y-0.25;
  torchLight.target.updateMatrixWorld();
  torchFill.position.copy(playerPos).addScaledVector(tFwd,2);
  torchFill.position.y=playerPos.y;

  const moving=keys.forward||keys.back||keys.left||keys.right;
  if(moving){
    const t2=clock.getElapsedTime()*(keys.sprint?6.5:3.8);
    legL.position.y=0.12+Math.sin(t2)*0.09;
    legR.position.y=0.12-Math.sin(t2)*0.09;
    armL.position.y=1.03-Math.sin(t2)*0.06;
    armR.position.y=1.03+Math.sin(t2)*0.06;
    avatarGroup.position.y+=Math.sin(t2*2)*0.018;
  }
}

let audioCtx=null, masterGain=null, audioStarted=false;
let radioNode=null, footstepTimer=0, nenekSoundTimer=0;

// Proximity heartbeat / breath sound nodes
let proximityGain=null, heartbeatOsc=null, heartbeatGain=null;
let lastNenekDist=999;

function initAudio(){
  if(audioStarted) return;
  audioStarted=true;
  torchOn=true;
  document.getElementById('torch-indicator').classList.add('on');
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.3;
    masterGain.connect(audioCtx.destination);

    // Drone
    function drone(freq,gain,detune){
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const f=audioCtx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=freq;
      if(detune) o.detune.value=detune;
      f.type='lowpass'; f.frequency.value=180+Math.random()*80;
      g.gain.value=gain;
      const lfo=audioCtx.createOscillator();
      const lg=audioCtx.createGain();
      lfo.frequency.value=0.04+Math.random()*0.07; lg.gain.value=9;
      lfo.connect(lg); lg.connect(o.detune);
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.start(); lfo.start();
    }
    drone(55,0.10,0); drone(55.4,0.05,6); drone(27.5,0.07,-4);

    // Wind
    function wind(){
      const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
      const src=audioCtx.createBufferSource();
      src.buffer=buf; src.loop=true;
      const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=350; f.Q.value=0.4;
      const g=audioCtx.createGain(); g.gain.value=0.025;
      src.connect(f); f.connect(g); g.connect(masterGain);
      src.start();
    }
    wind();

    // Traffic hum
    function trafficHum(){
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const f=audioCtx.createBiquadFilter();
      o.type='sine'; o.frequency.value=68;
      f.type='lowpass'; f.frequency.value=120;
      g.gain.value=0.04;
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.start();
    }
    trafficHum();

    // Radio
    function buildRadio(){
      const radioGain=audioCtx.createGain(); radioGain.gain.value=0.0;
      const amFilter=audioCtx.createBiquadFilter(); amFilter.type='bandpass'; amFilter.frequency.value=1200; amFilter.Q.value=0.8;
      const distortion=audioCtx.createWaveShaper();
      const curve=new Float32Array(256);
      for(let i=0;i<256;i++){ const x=i*2/256-1; curve[i]=x*(1.2+Math.abs(x)); }
      distortion.curve=curve;
      const staticBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
      const sd=staticBuf.getChannelData(0);
      for(let i=0;i<sd.length;i++) sd[i]=(Math.random()*2-1)*0.15;
      const staticSrc=audioCtx.createBufferSource();
      staticSrc.buffer=staticBuf; staticSrc.loop=true;
      const sGain=audioCtx.createGain(); sGain.gain.value=0.3;
      staticSrc.connect(sGain); sGain.connect(radioGain);
      const notes=[220,246,261,293,330,293,261,246];
      let ni=0;
      const melody=audioCtx.createOscillator();
      melody.type='triangle'; melody.frequency.value=notes[0];
      const mGain=audioCtx.createGain(); mGain.gain.value=0.12;
      melody.connect(amFilter); amFilter.connect(distortion); distortion.connect(mGain); mGain.connect(radioGain);
      melody.start(); staticSrc.start();
      let noteTime=audioCtx.currentTime;
      function scheduleNotes(){
        for(let n=0;n<16;n++){
          melody.frequency.setValueAtTime(notes[ni%notes.length], noteTime);
          mGain.gain.setValueAtTime(Math.random()>0.15?0.12:0, noteTime);
          ni++; noteTime+=0.35;
        }
        setTimeout(scheduleNotes, 5000);
      }
      scheduleNotes();
      radioGain.connect(masterGain);
      radioNode=radioGain;
    }
    buildRadio();

    // Creaks
    function scheduleCreak(){
      const delay=6+Math.random()*18;
      setTimeout(()=>{
        if(!audioCtx) return;
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(160+Math.random()*60,audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(55,audioCtx.currentTime+0.4);
        g.gain.setValueAtTime(0.07,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
        o.connect(g); g.connect(masterGain);
        o.start(); o.stop(audioCtx.currentTime+0.55);
        scheduleCreak();
      }, delay*1000);
    }
    scheduleCreak();

    // Proximity heartbeat — slow thud that speeds up when nenek is near
    heartbeatGain = audioCtx.createGain();
    heartbeatGain.gain.value = 0;
    heartbeatGain.connect(masterGain);

    function scheduleHeartbeat(){
      if(!audioCtx||!heartbeatGain) return;
      const dist = lastNenekDist;
      const rate = dist < 20 ? Math.max(0.4, dist/20) : 1.5; // faster when closer
      const vol  = dist < 18 ? Math.max(0, (18-dist)/18 * 0.18) : 0;
      heartbeatGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.3);

      if(vol > 0.01){
        // Double thud
        [0, 0.12].forEach(offset=>{
          const o=audioCtx.createOscillator();
          const g=audioCtx.createGain();
          o.type='sine'; o.frequency.value=55+Math.random()*10;
          g.gain.setValueAtTime(0, audioCtx.currentTime+offset);
          g.gain.linearRampToValueAtTime(1, audioCtx.currentTime+offset+0.02);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+offset+0.22);
          o.connect(g); g.connect(heartbeatGain);
          o.start(audioCtx.currentTime+offset);
          o.stop(audioCtx.currentTime+offset+0.25);
        });
      }
      setTimeout(scheduleHeartbeat, rate*800);
    }
    scheduleHeartbeat();

  }catch(e){ console.warn('Audio fail:',e); }
}

  g1.gain.setValueAtTime(0.18,audioCtx.currentTime+0.9);
  g1.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.5);

      const eg=sCtx.createRadialGradient(W*0.5+dx-10,H2*0.39,0,W*0.5+dx-10,H2*0.39,6);
      eg.addColorStop(0,'rgba(255,180,50,0.85)'); eg.addColorStop(1,'transparent');
      sCtx.fillStyle=eg; sCtx.fillRect(W*0.5+dx-16,H2*0.36,12,12);
    });
    const rg=sCtx.createLinearGradient(0,H2*0.42,0,H2);
    rg.addColorStop(0,'rgba(0,180,80,0.06)'); rg.addColorStop(1,'transparent');
    sCtx.fillStyle=rg; sCtx.fillRect(0,H2*0.42,W,H2);
    const v=sCtx.createRadialGradient(W*0.5,H2*0.5,W*0.08,W*0.5,H2*0.5,W*0.72);
    v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,0.9)');
    sCtx.fillStyle=v; sCtx.fillRect(0,0,W,H2);
  }

  for(let i=0;i<2500;i++){
    sCtx.fillStyle=`rgba(255,255,255,${Math.random()*0.045})`;
    sCtx.fillRect(Math.random()*W,Math.random()*H2,1,1);
  }
  sCtx.fillStyle='rgba(0,0,0,0.22)';
  for(let y=0;y<H2;y+=3) sCtx.fillRect(0,y,W,1);
}

function showStatic(type,msg,dur){
  H.staticActive=true;
  drawStatic(type);
  staticMsg.textContent=msg||'';
  staticFrame.classList.add('active');
  H.staticTimer=dur||2.5;
}

function spawnNenek(){
  // Spawn BEHIND player — within ±60° behind
  const behindAng = yaw + Math.PI + (Math.random()-0.5)*1.0;
  const dist = 10 + Math.random()*8;
  nenekGroup.position.set(
    playerPos.x + Math.sin(behindAng)*dist,
    0,
    playerPos.z + Math.cos(behindAng)*dist
  );
  nenekGroup.rotation.y = yaw; // facing player
  nenekGroup.visible = true;
  H.nenekActive=true; H.nenekPhase='still'; H.nenekTimer=1.2+Math.random()*1.5;
  subtitle.textContent='NENEK KEBAYAN';
  subtitle.classList.add('visible');
  setTimeout(()=>subtitle.classList.remove('visible'),3000);
  if(radioNode&&audioCtx) radioNode.gain.setTargetAtTime(0.18,audioCtx.currentTime,1.0);
  // Immediate proximity whisper on spawn
  setTimeout(()=>playNenekProximityWhisper(), 400);
}

let nenekWalkAnimT = 0;

function updateHorror(dt,elapsed){
  if(!H.staticActive && !H.nenekActive){
    if(elapsed-H.lastEvent>H.nextDelay){
      H.lastEvent=elapsed;
      H.nextDelay=12+Math.random()*30;
      const r=Math.random();
      if     (r<0.30) H.flickerTimer=3+Math.random()*4;
      else if(r<0.55) showStatic('alley',MSGS[Math.floor(Math.random()*MSGS.length)],2+Math.random());
      else if(r<0.80) spawnNenek();
      else            showStatic('nenek','DIA NAMPAK AWAK',3);
    }
  }

  // Flicker
  if(H.flickerTimer>0){
    H.flickerTimer-=dt;
    lampLights.forEach(l=>{
      if(Math.random()>0.45){
        l.light.intensity=Math.random()*l.base;
        if(l.mesh&&l.mesh.material) l.mesh.material.emissiveIntensity=Math.random()*1.5;
      }
    });
    if(Math.random()>0.75){ horrorOverlay.classList.add('flash'); setTimeout(()=>horrorOverlay.classList.remove('flash'),70); }
  } else {
    const t=clock.getElapsedTime();
    lampLights.forEach(l=>{
      l.light.intensity=l.base*(0.90+0.10*Math.sin(t*l.phase));
    });
  }

  // Static frame
  if(H.staticActive){
    H.staticTimer-=dt;
    if(H.staticTimer<=0){ H.staticActive=false; staticFrame.classList.remove('active'); }
  }

  H.antennaBlink+=dt;
  antennaLight.intensity=H.antennaBlink%2<0.15?0.8:0;

  // ── NENEK UPDATE ──────────────────────────────────────────
  if(H.nenekActive){
    H.nenekTimer-=dt;
    const toPlayer=new THREE.Vector3().subVectors(playerPos,nenekGroup.position);
    const dist=toPlayer.length();
    lastNenekDist = dist; // for heartbeat system

    // Nenek glow — glows amber when close
    nenekGlow.intensity = dist < 12 ? Math.max(0,(12-dist)/12 * 0.8) : 0;

    // Proximity pulse overlay
    if(dist < 18){
      nenekPulse.classList.add('near');
      nenekWarn.classList.add('visible');
      if(radioNode&&audioCtx) radioNode.gain.setTargetAtTime(Math.max(0,(18-dist)/18*0.22),audioCtx.currentTime,0.5);
    } else {
      nenekPulse.classList.remove('near');
      nenekWarn.classList.remove('visible');
    }

    // Proximity whisper — periodic
    nenekSoundTimer-=dt;
    if(dist < 15 && nenekSoundTimer<=0){
      playNenekLaugh();
      if(dist < 10) playNenekProximityWhisper();
      nenekSoundTimer = 2.5 + Math.random()*3;
    } else if(dist >= 15){
      nenekSoundTimer = Math.max(nenekSoundTimer, 3);
    }

    // STILL phase
    if(H.nenekPhase==='still'){
      if(H.nenekTimer<=0){ H.nenekPhase='walking'; H.nenekTimer=5+Math.random()*5; }
    }
    // WALKING phase — she approaches
    else if(H.nenekPhase==='walking'){
      if(dist > 1.8){
        toPlayer.normalize();
        nenekGroup.position.addScaledVector(toPlayer, 1.4*dt);
        nenekGroup.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

        // Walk animation — visible hunched gait
        nenekWalkAnimT += dt * 2.8;
        const stepBob = Math.abs(Math.sin(nenekWalkAnimT)) * 0.06;
        nenekGroup.position.y = stepBob;
        nenLegL.position.y = 0.08 + Math.sin(nenekWalkAnimT) * 0.07;
        nenLegR.position.y = 0.08 - Math.sin(nenekWalkAnimT) * 0.07;
        nenArmL.position.y = 0.68 + Math.sin(nenekWalkAnimT) * 0.05;
        nenArmR.position.y = 0.68 - Math.sin(nenekWalkAnimT) * 0.05;

        // Nenek footstep sound
        H.nenekFootstepTimer -= dt;
        if(H.nenekFootstepTimer <= 0 && dist < 20){
          playNenekFootstep();
          H.nenekFootstepTimer = 0.55 + Math.random()*0.2;
        }
      }

      if(dist < 2.2 || H.nenekTimer<=0){
        nenekGroup.visible=false;
        H.nenekActive=false; H.nenekPhase='idle';
        nenekPulse.classList.remove('near');
        nenekWarn.classList.remove('visible');
        horrorOverlay.classList.add('red');
        setTimeout(()=>horrorOverlay.classList.remove('red'),500);
        if(radioNode&&audioCtx) radioNode.gain.setTargetAtTime(0,audioCtx.currentTime,1.5);
        nenekSoundTimer=5;
        lastNenekDist=999;
      }
    }

    // Freeze when player looks at her
    const toCam=new THREE.Vector3().subVectors(nenekGroup.position,camera.position).normalize();
    const camDir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    if(toCam.dot(camDir)>0.96 && dist<22){
      H.nenekPhase='still'; H.nenekTimer=Math.max(H.nenekTimer,1.5);
      if(radioNode&&audioCtx) radioNode.gain.setTargetAtTime(0.05,audioCtx.currentTime,0.3);
    }
  } else {
    lastNenekDist = 999;
    nenekPulse.classList.remove('near');
  }
}

// Torch toggle
document.addEventListener('keydown',e=>{
  if(e.key==='t'||e.key==='T'){
    torchOn=!torchOn;
    document.getElementById('torch-indicator').classList.toggle('on',torchOn);
  }
});

// ─── FOOTSTEP TIMER ───────────────────────────────────────────
function updateFootsteps(dt){
  const moving=keys.forward||keys.back||keys.left||keys.right;
  if(!moving){ footstepTimer=0; return; }
  const interval=keys.sprint?0.28:0.45;
  footstepTimer+=dt;
  if(footstepTimer>=interval){ playFootstep(); footstepTimer=0; }
}

// ─── HUD ──────────────────────────────────────────────────────
const timeEl=document.getElementById('time-display');
const coordEl=document.getElementById('coords');
let gameMin=3*60+17, lastHUD=0;

function updateHUD(elapsed){
  if(elapsed-lastHUD<1) return;
  lastHUD=elapsed; gameMin=(gameMin+1)%(24*60);
  const h12=gameMin%(12*60); const dh=h12===0?12:Math.floor(h12/60);
  const dm=(gameMin%60).toString().padStart(2,'0');
  const sfx=gameMin<12*60?'AM':'PM';
  timeEl.textContent=`${dh.toString().padStart(2,'0')}:${dm} ${sfx}`;
  const lat=(3.1390+playerPos.z*0.000018).toFixed(4);
  const lon=(101.6869+playerPos.x*0.000018).toFixed(4);
  coordEl.textContent=`${lat}° N, ${lon}° E`;
}

function updateClouds(dt){
  clouds.forEach(c=>{ c.mesh.position.x+=c.speed*dt; if(c.mesh.position.x>170) c.mesh.position.x=-170; });
}

const hint=document.getElementById('hint');
let hintT=5, hintDone=false;

// ─── MAIN LOOP ────────────────────────────────────────────────
setLoad(92,'hampir siap...');

let prevTime=0;
function animate(timestamp){
  requestAnimationFrame(animate);
  const elapsed=clock.getElapsedTime();
  const dt=Math.min((timestamp-prevTime)/1000,0.05);
  prevTime=timestamp;

  updatePlayer(dt);
  updateClouds(dt);
  updateHorror(dt,elapsed);
  updateHUD(elapsed);
  updateFootsteps(dt);

  // Torch — bright when on, point at distance
  if(torchOn){
    torchLight.intensity = 5.5 + Math.sin(elapsed*8)*0.08;
    torchFill.intensity  = 1.8;
  } else {
    torchLight.intensity = 0;
    torchFill.intensity  = 0;
  }

  if(!hintDone){ hintT-=dt; if(hintT<=0){ hint.style.opacity='0'; hintDone=true; } }

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ─── LAUNCH SEQUENCE ──────────────────────────────────────────
setLoad(100,'selamat datang ke kawasan');
setTimeout(()=>{
  const lo=document.getElementById('loading');
  lo.style.opacity='0';
  setTimeout(()=>{
    lo.style.display='none';
    // Show nenek intro, then start game
    runNenekIntro(()=>{
      requestAnimationFrame(animate);
    });
  }, 1200);
},1400);

})();
</script>
